services:

  # ── PHP-FPM (Web) ─────────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: job_scraper_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - php_logs:/var/log
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: mysql://root:root@mysql:3306/job_scraper?serverVersion=8.0&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/job_offers
    networks:
      - job_scraper_network

  # ── Worker Symfony Messenger (consommateur RabbitMQ) ──────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: job_scraper_worker
    restart: unless-stopped
    command: php bin/console messenger:consume async --limit=50 --time-limit=3600 -vv
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: mysql://root:root@mysql:3306/job_scraper?serverVersion=8.0&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/job_offers
    networks:
      - job_scraper_network

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: job_scraper_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - job_scraper_network

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: job_scraper_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_scraper
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-proot", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - job_scraper_network

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: job_scraper_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Interface admin RabbitMQ → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - job_scraper_network

  # ── Adminer (gestionnaire MySQL en UI) ────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: job_scraper_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"     # Interface Adminer → http://localhost:8081
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - job_scraper_network

# ── Scraper Python (cron toutes les 6h) ──────────────────────────────────────
scraper:
  build:
    context: .
    dockerfile: docker/scraper/Dockerfile
  container_name: job_scraper_python
  restart: unless-stopped
  depends_on:
    - nginx
  networks:
    - job_scraper_network
    
# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  rabbitmq_data:
  php_logs:
  nginx_logs:

# ── Réseau ────────────────────────────────────────────────────────────────────
networks:
  job_scraper_network:
    driver: bridge
